[project]
name = "indexlens"
version = "0.1.0"
description = "AI-Powered Gmail Data & Stats Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "openai>=1.14.0",
    "instructor>=1.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
indexlens = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
